name: Windows portable

on:
  push:
    branches: [main]
    tags: ['windows-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег нового релиза (пусто — только собрать ZIP)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005 # v4.3.0
        with:
          version: '6.8.3'
          arch: win64_mingw
          archives: qtbase
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
          cache: true
      - name: Build and test
        shell: pwsh
        run: |
          $compiler = Join-Path $env:IQTA_TOOLS 'mingw1310_64/bin/g++.exe'
          if (!(Test-Path $compiler)) { throw "MinGW compiler not found: $compiler" }
          cmake -S . -B build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" "-DCMAKE_CXX_COMPILER=$compiler"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed' }
          cmake --build build-windows --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          ctest --test-dir build-windows --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Package application
        shell: pwsh
        run: ./scripts/package_windows.ps1 -QtRoot $env:QT_ROOT_DIR -CompilerBin "$env:IQTA_TOOLS/mingw1310_64/bin"
      - name: Check portable archive without Qt in PATH
        shell: pwsh
        run: ./scripts/check_windows_portable.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShellEmulator-Windows-x64
          path: dist/ShellEmulator-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/windows-v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ShellEmulator-Windows-x64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" ShellEmulator-Windows-x64.zip \
            --target "$TARGET_SHA" --title "Windows: эмулятор оболочки" \
            --notes "Windows 10/11, 64 бит. Скачайте ShellEmulator-Windows-x64.zip, полностью распакуйте архив и запустите start.bat. Устанавливать Qt и компилятор не нужно. В комплекте библиотеки и заполненная VFS."
